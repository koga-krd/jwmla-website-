<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>کۆگا | Koga</title>
<meta name="theme-color" content="#181818">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ========================= HOME VIEW ========================= -->
  <section class="view" id="view-home">
    <div class="top-header" id="topHeader">
      <div class="top-banner" id="topBanner">
        <img src="https://i.ibb.co/b4XkfrW/Gray-Pink-Modern-New-Collection-Sale-Website-Shop-Blog-Banner.png" alt="banner" id="topBannerImg" width="800" height="190" decoding="async" fetchpriority="high" referrerpolicy="no-referrer" onload="handleImgLoad(this)" onerror="handleImgError(this)">
      </div>
      <div class="action-bar">
        <div class="brand">
          <span class="brand-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/></svg>
          </span>
          <span class="brand-name" id="brandName">کۆگا</span>
        </div>
        <span class="shop-now">shop now</span>
        <div class="search-wrap">
          <input type="text" id="searchInputHome" placeholder="گەڕان...">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
      </div>
      <div class="cat-pills" id="catPillsHome"></div>
    </div>

    <div class="grid" id="gridHome"></div>
  </section>

  <!-- ========================= OFFERS VIEW ========================= -->
  <section class="view" id="view-offers" hidden>
    <div class="section-header">
      <h2 id="offersTitle">بەشی ئۆفەر</h2>
    </div>
    <div class="grid" id="gridOffers"></div>
  </section>

  <!-- ========================= SEARCH VIEW ========================= -->
  <section class="view" id="view-search" hidden>
    <div class="section-header">
      <h2 id="searchTitle">گەڕان و پۆلەکان</h2>
    </div>
    <div class="search-page-bar">
      <input type="text" id="searchInputPage" placeholder="گەڕان...">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </div>
    <div class="cat-pills cat-pills-page" id="catPillsSearch"></div>
    <div class="company-filter-row">
      <label id="lblCompanyFilter" for="companyFilterSelect">کۆمپانیا</label>
      <select id="companyFilterSelect">
        <option value="" id="companyFilterAllOpt">هەموو کۆمپانیاکان</option>
      </select>
    </div>
    <div class="sort-row-page">
      <button class="sort-opt" id="sortLowPage" data-sort="low">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        <span id="sortLowPageText">کەمترین نرخ</span>
      </button>
      <button class="sort-opt" id="sortHighPage" data-sort="high">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <span id="sortHighPageText">زۆرترین نرخ</span>
      </button>
      <button class="sort-opt" id="sortResetPage">
        <span id="sortResetPageText">پاکردنەوە</span>
      </button>
    </div>
    <div class="grid" id="gridSearch"></div>
  </section>

  <!-- ========================= CART VIEW ========================= -->
  <section class="view" id="view-cart" hidden>
    <div class="section-header">
      <h2 id="cartPageTitle">سەبەتەی کڕین</h2>
    </div>
    <div id="cartListPage" class="cart-list-page"></div>
    <div class="cart-footer-page">
      <div class="cart-total-line">
        <span id="cartTotalLabel">کۆی گشتی</span>
        <span id="cartTotalPage">0</span>
      </div>
      <button type="button" class="btn-dark btn-order-page" id="cartOrderBtnPage" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-3px;margin-left:6px;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82.83-3.03-.2-.31a8.19 8.19 0 0 1-1.26-4.39c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.23-8.25 8.23z"/></svg>
        <span id="cartOrderPageText">داواکردن لە وەتساپ</span>
      </button>
    </div>
  </section>

  <!-- ========================= PROFILE VIEW ========================= -->
  <section class="view" id="view-profile" hidden>
    <div class="section-header">
      <h2 id="profileTitle">هەژمار</h2>
    </div>

    <div class="profile-card">
      <div class="profile-card-title" id="langCardTitle">زمان</div>
      <div class="lang-row" id="langRowProfile">
        <button data-lang="ku">کوردی</button>
        <button data-lang="ar">العربية</button>
        <button data-lang="en">English</button>
      </div>
    </div>

    <div class="profile-card" id="loginCard">
      <div class="profile-card-title" id="loginCardTitle">چوونەژوورەوەی بەڕێوەبەر</div>
      <form id="loginForm" class="profile-form">
        <input type="email" id="loginEmail" placeholder="ئیمەیل" required autocomplete="username">
        <input type="password" id="loginPassword" placeholder="وشەی نهێنی" required autocomplete="current-password">
        <button type="submit" class="btn-dark" id="loginSubmitBtn">چوونەژوورەوە</button>
      </form>
      <p class="profile-hint" id="loginError" hidden></p>
    </div>

    <div class="profile-card" id="adminCard" hidden>
      <div class="profile-card-title" id="adminCardTitle">بەڕێوەبەری وێبسایت</div>
      <button type="button" class="btn-dark" id="addProductBtnProfile">+ زیادکردنی کاڵا</button>
      <button type="button" class="btn-outline" id="logoutBtnProfile">دەرچوون</button>
    </div>

    <div class="profile-card" id="settingsCard" hidden>
      <div class="profile-card-title" id="settingsCardTitle">ڕێکخستنی فرۆشگا</div>
      <form id="settingsForm" class="profile-form">
        <label class="settings-label" id="lblStoreName">ناوی فرۆشگا</label>
        <input type="text" id="settingStoreName" placeholder="کۆگا">
        <label class="settings-label" id="lblStorePhone">ژمارە مۆبایل (وەتساپ)</label>
        <input type="text" id="settingPhone" placeholder="9647508457841" dir="ltr">
        <label class="settings-label" id="lblStoreBanner">لینکی بانەری سەرەکی</label>
        <input type="url" id="settingBanner" placeholder="https://...">
        <label class="settings-label" id="lblStoreInfo">دەقی زانیاری</label>
        <textarea id="settingInfo" rows="4"></textarea>
        <button type="submit" class="btn-dark" id="settingsSaveBtn">پاشەکەوتکردنی ڕێکخستنەکان</button>
      </form>
      <p class="profile-hint" id="settingsSaved" hidden></p>
    </div>

    <div class="profile-card">
      <div class="profile-card-title" id="infoCardTitle">زانیاری</div>
      <p class="profile-info-text" id="infoBodyText"></p>
    </div>
  </section>

</div>

<!-- ===== Bottom navigation ===== -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span id="navHomeText">Home</span>
  </button>
  <button class="nav-btn" data-view="offers">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 15l6-6M9 9h.01M15 15h.01"/></svg>
    <span id="navOffersText">Offers</span>
  </button>
  <button class="nav-btn" data-view="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span id="navSearchText">Search</span>
  </button>
  <button class="nav-btn" data-view="cart">
    <span class="nav-icon-wrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="nav-badge" id="navCartBadge" hidden>0</span>
    </span>
    <span id="navCartText">Cart</span>
  </button>
  <button class="nav-btn" data-view="profile">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="navProfileText">Profile</span>
  </button>
</nav>

<!-- ===== Product detail modal ===== -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="modal-close" id="detailClose">✕</button>

    <div class="detail-carousel">
      <div class="detail-track" id="detailTrack"></div>
      <div class="detail-dots" id="detailDots"></div>
      <div class="detail-oos-badge" id="detailOosBadge" hidden>نەماوە</div>
      <button type="button" class="detail-nav-arrow detail-nav-prev" id="detailPrevBtn" hidden aria-label="previous image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="detail-nav-arrow detail-nav-next" id="detailNextBtn" hidden aria-label="next image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <h2 id="detailName" style="padding-left:0;"></h2>
    <div class="detail-price-row">
      <span class="detail-price" id="detailPiece"></span>
      <span class="detail-price-label" id="detailPieceLabel"></span>
      <span class="detail-trend" id="detailTrend"></span>
    </div>

    <button class="btn-dark btn-add-cart btn-add-cart-top" id="detailAddCart">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-left:6px;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="detailAddCartText">زیادکردن بۆ سەبەتە</span>
    </button>

    <div class="detail-row"><span id="lblCartonD">نرخی کارتۆن</span><span id="detailCarton"></span></div>
    <div class="detail-row"><span id="lblUnitsD">دانه/کارتۆن</span><span id="detailUnits"></span></div>
    <div class="detail-row"><span id="lblCodeD">کۆدی کاڵا</span><span id="detailCode"></span></div>
    <div class="detail-row"><span id="lblCompanyD">ناوی کۆمپانیا</span><span id="detailCompany"></span></div>
    <div class="detail-row"><span id="lblCatD">جۆر</span><span id="detailCat"></span></div>
    <div class="detail-desc" id="detailDesc"></div>

    <div class="specs-section" id="detailSpecsSection" hidden>
      <div class="specs-title" id="detailSpecsTitle">زانیاری</div>
      <div class="specs-table" id="detailSpecsTable"></div>
    </div>

    <div class="detail-admin-actions" id="detailAdminActions" hidden>
      <button type="button" class="btn-outline" id="detailEditBtn">دەستکاریکردن</button>
      <button type="button" class="btn-outline btn-danger-outline" id="detailDeleteBtn">سڕینەوە</button>
    </div>
  </div>
</div>

<!-- ===== "Added to cart" toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Add/Edit product form modal (admin-only) ===== -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="modal-close" id="formClose">✕</button>
    <h2 id="formTitle">زیادکردنی کاڵا</h2>
    <form id="productForm">
      <input type="hidden" id="prodId">

      <div class="field">
        <label id="lblImages">وێنەکانی کاڵا (لینک)</label>
        <div id="imageInputs" class="image-inputs"></div>
        <button type="button" class="btn-outline btn-add-image" id="addImageBtn">+ زیادکردنی وێنەیەکی تر</button>
      </div>

      <div class="field">
        <label id="lblName">ناوی کاڵا <span class="req">*</span></label>
        <input type="text" id="fName" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label id="lblCode">کۆدی کاڵا</label>
          <input type="text" id="fCode">
        </div>
        <div class="field">
          <label id="lblCompany">ناوی کۆمپانیا</label>
          <input type="text" id="fCompany">
        </div>
      </div>

      <div class="field">
        <label id="lblCategory">جۆر / پۆل <span class="hint" id="lblCategoryHint">(دەتوانیت چەند پۆلێک هەڵبژێریت)</span></label>
        <div class="chip-select" id="fCategories"></div>
        <div class="cat-row">
          <input type="text" id="newCatInput" placeholder="پۆلی نوێ...">
          <button type="button" id="addCatBtn">+</button>
        </div>
      </div>

      <div class="field">
        <label id="lblSection">شوێنی دەرکەوتن</label>
        <div class="radio-row">
          <label class="radio-opt selected" id="optMain">
            <input type="radio" name="section" value="main" checked>
            <span id="optMainText">بەشی سەرەکی</span>
          </label>
          <label class="radio-opt" id="optOffers">
            <input type="radio" name="section" value="offers">
            <span id="optOffersText">بەشی ئۆفەر</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label id="lblTrend">جۆری کاڵا (ئۆرجینال / کۆپی / ماستەرکۆپی)</label>
        <input type="text" id="fTrend" placeholder="Original / Copy / Master Copy">
      </div>

      <div class="field">
        <label id="lblSpecs">زانیاری (وەک: Brand, Color, Warranty, Capacity)</label>
        <div id="specInputs" class="spec-inputs"></div>
        <button type="button" class="btn-outline btn-add-image" id="addSpecBtn">+ زیادکردنی تایبەتمەندی</button>
      </div>

      <div class="field">
        <label id="lblPiece">نرخی دانه <span class="req">*</span></label>
        <input type="text" id="fPiece" inputmode="decimal" placeholder="12500 یان $12.50" required>
      </div>
      <div class="field">
        <label id="lblCarton">نرخی کارتۆن</label>
        <input type="text" id="fCarton" inputmode="decimal" placeholder="12500 یان $12.50">
      </div>
      <div class="field">
        <label id="lblUnits">ژمارەی دانه له کارتۆنێکدا</label>
        <input type="number" id="fUnits" min="0" step="1">
      </div>
      <div class="field oos-toggle-field">
        <label class="oos-toggle" for="fOutOfStock">
          <input type="checkbox" id="fOutOfStock">
          <span class="oos-toggle-track"></span>
          <span id="lblOutOfStock">نەماوە (کۆتایی هاتووە)</span>
        </label>
      </div>
      <div class="field">
        <label id="lblDesc">تێبینی / وردەکاری</label>
        <textarea id="fDesc"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-outline" id="cancelBtn">پاشگەزبوونەوه</button>
        <button type="submit" class="btn-dark" id="saveBtn">پاشەکەوتکردن</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Firebase SDK (compat build — plain <script> tags, no bundler needed) ===== -->
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
